<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静谧观测点 | 3D Terrain</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030303; /* 极深的背景色 */
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* 极简的等宽字体 */
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 左下角的数据监控 UI */
        .overlay-ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.7;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        .highlight {
            color: #88ccff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="overlay-ui">
        <div>STATUS: <span class="highlight">ONLINE</span></div>
        <div>TOPOGRAPHY MAPPING: <span id="frame-counter" class="highlight">0000</span></div>
        <div>COORDINATES: <span id="coord-display">N 0.00° E 0.00°</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. 初始化场景、相机和渲染器
        const scene = new THREE.Scene();
        // 添加极微弱的雾化效果，增加深邃感
        scene.fog = new THREE.FogExp2(0x030303, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. 生成粒子地貌 (点云地形)
        // 创建一个高密度的平面网格
        const geometry = new THREE.PlaneGeometry(200, 200, 150, 150);
        const positions = geometry.attributes.position.array;

        // 通过数学函数扭曲平面，生成起伏的地形
        for (let i = 0; i < positions.length; i += 3) {
            let x = positions[i];
            let y = positions[i + 1];
            // 使用正弦和余弦函数模拟山脉和陨石坑的起伏，叠加一点随机性
            positions[i + 2] = Math.sin(x / 10) * Math.cos(y / 10) * 8 + (Math.random() * 0.5);
        }

        // 材质设置：微弱的银蓝色光点
        const material = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x88ccff,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        // 将平面旋转，使其平铺在视野下方
        particles.rotation.x = -Math.PI / 2.2;
        scene.add(particles);

        // 3. 动画与交互逻辑
        let frame = 0;
        let mouseX = 0;
        let mouseY = 0;

        // 监听鼠标移动，让视角产生微小的偏移
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.01;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.01;
        });

        // 窗口大小适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const frameCounter = document.getElementById('frame-counter');
        const coordDisplay = document.getElementById('coord-display');

        // 核心渲染循环
        function animate() {
            requestAnimationFrame(animate);
            frame++;

            // 让地形缓慢旋转和漂移
            particles.rotation.z += 0.001;
            
            // 相机跟随鼠标平滑移动 (缓动效果)
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY + 15 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            // 更新左下角的 UI 数据，模拟测绘坐标的变化
            if (frame % 5 === 0) {
                frameCounter.innerText = String(frame).padStart(5, '0');
                let lat = (Math.abs(Math.sin(frame * 0.01)) * 90).toFixed(2);
                let lon = (Math.abs(Math.cos(frame * 0.005)) * 180).toFixed(2);
                coordDisplay.innerText = `N ${lat}° E ${lon}°`;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
